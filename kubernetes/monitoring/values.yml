alertmanager:
  enabled: false

grafana:
  enabled: true

  defaultDashboardsEnabled: true

  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - grafana.homelab
    path: /
    pathType: Prefix

  persistence:
    enabled: false

  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 256Mi

prometheus:
  enabled: true

  prometheusSpec:
    retention: 1d

    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi

prometheusOperator:
  enabled: true

  admissionWebhooks:
    enabled: false

  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true

defaultRules:
  create: false

kubeEtcd:
  enabled: false

kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false